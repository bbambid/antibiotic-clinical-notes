<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>膀胱炎｜文章編集</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f7f9fb;color:#182a3b}main{background:white;padding:22px;border-radius:14px}textarea{width:100%;min-height:190px;box-sizing:border-box;padding:12px;font:15px/1.65 system-ui;border:1px solid #adb9c6;border-radius:8px}input{width:100%;box-sizing:border-box;padding:10px}button{padding:12px 18px;border:0;border-radius:8px;background:#145b83;color:white;cursor:pointer;margin:8px 4px 8px 0}button:disabled{opacity:.45;cursor:not-allowed}section{margin:22px 0}small,.muted{color:#526273}#status{white-space:pre-wrap}pre{white-space:pre-wrap;background:#eef3f7;padding:15px;border-radius:8px}label{display:block;margin-bottom:8px;font-weight:600}.diff{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 ui-monospace,monospace;border:1px solid #d9e3ea;border-radius:9px;padding:12px}.removed{background:#ffe8e8;color:#842a2a}.added{background:#e4f7e9;color:#205b34}.same{color:#64748b}h3{margin-top:20px}</style></head><body><main><h1>膀胱炎｜文章編集</h1><p>文章を編集し、<strong>本番との差分を確認してから公開</strong>できます。テストブランチへの保存は不要です。</p><p class="muted">GitHubアクセストークンはこの画面でのみ使用し、保存しません。患者情報や秘密情報は入力しないでください。</p><section><label for="token">GitHubアクセストークン（一時入力）</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><button id="load">本番の文章を読み込む</button></section><div id="editor"></div><button id="compare" disabled>本番との差分を確認</button><button id="publish" disabled style="background:#276748">確認した内容を本番に保存</button><p id="status" role="status"></p><div id="result"></div><p><a href="./">公開サイトを開く</a></p></main><script>
const owner='bbambid',repo='antibiotic-clinical-notes',path='content/cystitis.json';
const endpoint='https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path;
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
let original=null,originalSha='',approved=null,approvedSha='';
const decode=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const encode=s=>{const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(bin)};
async function github(method,body){const token=$('token').value.trim();if(!token)throw Error('アクセストークンを入力してください');const res=await fetch(endpoint+(method==='GET'?'?ref=main':''),{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json();if(!res.ok)throw Error('GitHub '+res.status+': '+(data.message||'アクセス失敗'));return data}
function validate(d){if(!d||typeof d.title!=='string'||!Array.isArray(d.sections)||!d.sections.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>typeof v==='string')))throw Error('文章データの形式が不正です')}
function collect(){if(!original)throw Error('先に読み込んでください');return {...original,sections:original.sections.map((p,i)=>[p[0],document.querySelector('textarea[data-index="'+i+'"]').value])}}
function invalidate(){approved=null;approvedSha='';$('publish').disabled=true}
$('load').onclick=async()=>{try{invalidate();status('本番の文章を読み込み中…');const f=await github('GET');const d=JSON.parse(decode(f.content));validate(d);original=d;originalSha=f.sha;const root=$('editor');root.replaceChildren();d.sections.forEach((pair,i)=>{const section=document.createElement('section'),label=document.createElement('label'),textarea=document.createElement('textarea');label.textContent=pair[0];textarea.value=pair[1];textarea.dataset.index=i;textarea.addEventListener('input',()=>{invalidate();$('result').replaceChildren();status('未確認の編集があります。差分を確認してください。')});section.append(label,textarea);root.append(section)});$('compare').disabled=false;$('result').replaceChildren();status('読み込み完了。編集後に「本番との差分を確認」を押してください。')}catch(e){status(e.message)}};
function diffLines(oldText,newText){const a=oldText.split('\n'),b=newText.split('\n');const n=a.length,m=b.length;if(n*m>100000){return [{type:'removed',text:oldText},{type:'added',text:newText}]}
const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
let i=0,j=0;const out=[];while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){out.push({type:'same',text:a[i++]});j++}else if(i<n&&(j===m||dp[i+1][j]>=dp[i][j+1]))out.push({type:'removed',text:a[i++]});else out.push({type:'added',text:b[j++]})}return out}
$('compare').onclick=async()=>{try{invalidate();const next=collect();validate(next);status('本番の最新版と照合中…');const current=await github('GET');if(current.sha!==originalSha){status('本番が他の操作で更新されています。再読み込みしてから編集してください。');return}const root=$('result');root.replaceChildren();let changes=0;next.sections.forEach((p,i)=>{const old=original.sections[i][1];if(old===p[1])return;changes++;const h=document.createElement('h3');h.textContent=p[0];const div=document.createElement('div');div.className='diff';const lines=diffLines(old,p[1]);lines.forEach((line,k)=>{if(k){div.append(document.createTextNode('\n'))}const span=document.createElement('span');span.className=line.type;span.textContent=(line.type==='removed'?'− ':line.type==='added'?'+ ':'  ')+line.text;div.append(span)});root.append(h,div)});if(!changes){status('変更はありません。');return}approved=JSON.stringify(next);approvedSha=current.sha;$('publish').disabled=false;status(changes+'項目の差分を表示しました。赤が削除、緑が追加です。内容を確認してから本番に保存してください。')}catch(e){status(e.message)}};
$('publish').onclick=async()=>{try{if(!approved||!approvedSha)throw Error('先に差分を確認してください');if(JSON.stringify(collect())!==approved){invalidate();throw Error('差分確認後に編集されています。再確認してください')}if(!confirm('表示した差分を本番サイトに公開します。よろしいですか？'))return;status('本番の更新状況を再確認中…');const current=await github('GET');if(current.sha!==approvedSha){invalidate();throw Error('本番が更新されています。再読み込みしてください')}status('本番へ保存中…');const f=await github('PUT',{message:'Publish reviewed cystitis text from web editor',content:encode(JSON.stringify(JSON.parse(approved),null,2)),sha:approvedSha,branch:'main'});original=JSON.parse(approved);originalSha=f.content.sha;invalidate();$('result').replaceChildren();status('本番に保存しました。GitHub Pagesの配信反映後、公開サイトを再読み込みしてください。')}catch(e){status(e.message)}};
window.addEventListener('pagehide',()=>{$('token').value=''});
</script></body></html>

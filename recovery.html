<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抗菌薬ノート・メモ救出</title><style>body{font-family:-apple-system,system-ui,sans-serif;background:#f4f7f9;color:#243447;max-width:680px;margin:auto;padding:22px}section{background:white;padding:18px;border-radius:14px;margin:14px 0}button{font-size:18px;padding:13px;border-radius:10px;background:#dceef7;border:1px solid #78a9c2;width:100%}p{line-height:1.6}.warn{color:#9a3326}</style></head><body><h1>抗菌薬ノート・メモ救出</h1><section><p>このページは<strong>現在開いているアプリ／ブラウザの保存領域</strong>にあるメモを読み取り、JSONとして書き出すためのものです。メモの削除・上書き・サイトデータ消去はしません。</p><p id="status">保存データを確認しています…</p><button id="export" disabled>メモと添付画像をJSONで保存</button><p id="result"></p></section><section><p class="warn"><strong>重要：</strong>Safariで0件でも、ホーム画面アプリ内のメモが消えたとは限りません。Safariとホーム画面アプリでは保存領域が異なる場合があります。0件のJSONを復元に使わないでください。</p><p><a href="./index.html?v=recovery-19">最新版の抗菌薬ノートを開く</a></p></section><script>(async()=>{const status=document.getElementById('status'),button=document.getElementById('export');let notes=[];try{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('antibiotic-clinical-notes',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')}});if(db.objectStoreNames.contains('state')){notes=await new Promise((resolve,reject)=>{const r=db.transaction('state','readonly').objectStore('state').get('notes');r.onsuccess=()=>resolve(Array.isArray(r.result)?r.result:[]);r.onerror=()=>reject(r.error)})}const legacy=JSON.parse(localStorage.getItem('abx-note-v1')||'[]');if(Array.isArray(legacy)){const ids=new Set(notes.map(n=>n.id));for(const n of legacy)if(n&&n.id&&!ids.has(n.id)){notes.push(n);ids.add(n.id)}}status.textContent='この保存領域で確認できたメモ：'+notes.length+'件（添付画像付き：'+notes.filter(n=>n.image).length+'件）';if(notes.length){button.disabled=false;button.onclick=()=>{const blob=new Blob([JSON.stringify({version:1,notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='抗菌薬ノート-救出バックアップ-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('result').textContent='保存操作を実行しました。「ファイル」アプリのダウンロード先を確認してください。'};}}catch(e){status.textContent='読み取りエラー：'+String(e)}})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>膀胱炎 編集テスト</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:auto;padding:20px;background:#f7f9fb;color:#182a3b}main{background:white;padding:22px;border-radius:14px}textarea{width:100%;min-height:190px;box-sizing:border-box;padding:12px;font:15px/1.65 system-ui;border:1px solid #adb9c6;border-radius:8px}input{width:100%;box-sizing:border-box;padding:10px}button{padding:12px 18px;border:0;border-radius:8px;background:#145b83;color:white;cursor:pointer;margin:8px 4px 8px 0}section{margin:22px 0}small,.muted{color:#526273}#status{white-space:pre-wrap}pre{white-space:pre-wrap;background:#eef3f7;padding:15px;border-radius:8px}label{display:block;margin-bottom:8px;font-weight:600}</style></head><body><main><h1>膀胱炎｜文章編集テスト</h1><p>テスト保存後に、本番反映ボタンで main に文章データを反映できます。GitHubの <code>prototype/cystitis-editor</code> ブランチへ保存します。<strong>公開サイトの文章は変わりません。</strong></p><p class="muted">認証情報はページ内・GitHubには保存しません。個人用のGitHub fine-grained token（対象リポジトリの Contents: Read and write のみ）をこの操作中だけ使います。共有端末では使用しないでください。</p><section><label for="token">GitHubアクセストークン（一時入力）</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><button id="load">GitHubから文章を読み込む</button></section><div id="editor"></div><button id="preview" disabled>プレビュー</button><button id="save" disabled>テストブランチへ保存</button><button id="publish" disabled style="background:#276748">本番に反映</button><p id="status" role="status"></p><div id="result"></div><p><a href="https://github.com/bbambid/antibiotic-clinical-notes/tree/prototype/cystitis-editor">テストブランチをGitHubで確認</a></p></main><script>
const owner='bbambid',repo='antibiotic-clinical-notes',branch='prototype/cystitis-editor',path='content/cystitis.json';let sha='',data=null;
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
let savedText='';const mainBranch='main';
const endpoint='https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path;
async function request(method,body){const token=$('token').value.trim();if(!token)throw Error('アクセストークンを入力してください');const res=await fetch(endpoint+'?ref='+encodeURIComponent(branch),{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const json=await res.json();if(!res.ok)throw Error('GitHub '+res.status+': '+(json.message||'アクセス失敗'));return json}
const decode=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\\n/g,'')),c=>c.charCodeAt(0)));
const encode=s=>{const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(bin)};
$('load').onclick=async()=>{try{status('読み込み中…');const f=await request('GET');sha=f.sha;data=JSON.parse(decode(f.content));const root=$('editor');root.replaceChildren();data.sections.forEach((pair,i)=>{const section=document.createElement('section'),label=document.createElement('label'),textarea=document.createElement('textarea');label.textContent=pair[0];textarea.value=pair[1];textarea.dataset.index=i;section.append(label,textarea);root.append(section)});$('save').disabled=$('preview').disabled=false;savedText=JSON.stringify(data);$('publish').disabled=false;status('読み込み完了。文章のみ編集できます。')}catch(e){status(e.message)}};
function collect(){if(!data)throw Error('先に読み込んでください');return {...data,sections:data.sections.map((p,i)=>[p[0],document.querySelector('textarea[data-index="'+i+'"]').value])}};
$('preview').onclick=()=>{try{const d=collect(),root=$('result');root.replaceChildren();d.sections.forEach(([title,body])=>{const h=document.createElement('h2'),p=document.createElement('pre');h.textContent=title;p.textContent=body;root.append(h,p)});status('プレビュー表示中（まだ保存していません）')}catch(e){status(e.message)}};
$('save').onclick=async()=>{try{const next=collect();if(!confirm('テストブランチに保存します。本番には反映されません。続けますか？'))return;status('保存中…');const f=await request('PUT',{message:'Edit cystitis content in isolated prototype',content:encode(JSON.stringify(next,null,2)),sha,branch});sha=f.content.sha;data=next;savedText=JSON.stringify(next);$('publish').disabled=false;status('テストブランチへの保存が完了しました。本番には反映されていません。')}catch(e){status(e.message)}};
$('publish').onclick=async()=>{try{if(!data)throw Error('先に読み込んでください');if(JSON.stringify(collect())!==savedText)throw Error('未保存の変更があります。先にテストブランチへ保存してください。');if(!confirm('テストブランチに保存済みの文章を main ブランチに公開します。続けますか？'))return;status('テストブランチと本番の状態を確認中…');const test=await request('GET');const testData=JSON.parse(decode(test.content));if(JSON.stringify(testData)!==savedText)throw Error('テストブランチが更新されています。再読み込みしてください。');const token=$('token').value.trim();const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};const mainRes=await fetch(endpoint+'?ref=main',{headers});let mainSha=null;if(mainRes.ok){const main=await mainRes.json();mainSha=main.sha;const mainData=JSON.parse(decode(main.content));if(JSON.stringify(mainData)===savedText){status('本番データはすでに同じ内容です。');return}}else if(mainRes.status!==404){const err=await mainRes.json();throw Error('本番確認失敗: '+(err.message||mainRes.status))}if(!confirm('最終確認：膀胱炎の文章データを main に反映します。公開ページがこのデータを読み込む設定かは別途確認が必要です。実行しますか？'))return;status('本番へ保存中…');const payload={message:'Publish reviewed cystitis content from editor',content:encode(JSON.stringify(testData,null,2)),branch:mainBranch};if(mainSha)payload.sha=mainSha;const put=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify(payload)});const result=await put.json();if(!put.ok)throw Error('本番反映失敗: '+(result.message||put.status));status('main ブランチへのデータ反映が完了しました。公開画面での表示は別途確認してください。')}catch(e){status(e.message)}};
window.addEventListener('pagehide',()=>{$('token').value=''});
</script></body></html>
